# T3 Code nightly builds. After editing, run: hk-app config-update t3code
repo=pingdotgg/t3code
# Nightlies and maintainer previews are both prereleases; only take nightlies.
tag_pattern='-nightly\.'
args=(--no-sandbox --password-store=gnome-libsecret)

# Move SSH hosts running T3 onto a background service at this release, so the
# desktop restarting no longer stops them. The conf is a symlink into the repo;
# the helper sits beside its target. A failed host must not block the update.
post_install="bash $(printf %q "$(dirname -- "$(readlink -f -- "${BASH_SOURCE[0]}")")/t3code-remote-update.sh") \"\$APP_TAG\" || printf '%s\\n' 'Remote T3 update incomplete; see above, then retry with hk-app config-update t3code.' >&2"
